<svg width="1280" height="380" viewBox="0 0 1280 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020810"/>
      <stop offset="50%" stop-color="#040B1E"/>
      <stop offset="100%" stop-color="#06132a"/>
    </linearGradient>
    <radialGradient id="glowC" cx="50%" cy="42%" r="38%">
      <stop offset="0%" stop-color="#00C8A4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00C8A4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tealLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C8A4" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00C8A4" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#00C8A4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00C8A4" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dotGrid" x="0" y="0" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="18" r="1.1" fill="rgba(255,255,255,0.07)"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="380" fill="url(#bgGrad)"/>
  <!-- Dot grid -->
  <rect width="1280" height="380" fill="url(#dotGrid)"/>
  <!-- Center teal glow -->
  <ellipse cx="640" cy="165" rx="520" ry="210" fill="url(#glowC)"/>

  <!-- Corner accents TL -->
  <line x1="0" y1="0" x2="48" y2="0" stroke="#00C8A4" stroke-width="2" stroke-opacity="0.55"/>
  <line x1="0" y1="0" x2="0" y2="32" stroke="#00C8A4" stroke-width="2" stroke-opacity="0.55"/>
  <!-- Corner accents TR -->
  <line x1="1280" y1="0" x2="1232" y2="0" stroke="#00C8A4" stroke-width="2" stroke-opacity="0.55"/>
  <line x1="1280" y1="0" x2="1280" y2="32" stroke="#00C8A4" stroke-width="2" stroke-opacity="0.55"/>
  <!-- Corner accents BL -->
  <line x1="0" y1="380" x2="48" y2="380" stroke="#00C8A4" stroke-width="2" stroke-opacity="0.55"/>
  <line x1="0" y1="380" x2="0" y2="348" stroke="#00C8A4" stroke-width="2" stroke-opacity="0.55"/>
  <!-- Corner accents BR -->
  <line x1="1280" y1="380" x2="1232" y2="380" stroke="#00C8A4" stroke-width="2" stroke-opacity="0.55"/>
  <line x1="1280" y1="380" x2="1280" y2="348" stroke="#00C8A4" stroke-width="2" stroke-opacity="0.55"/>

  <!-- Shield logo mark (centered) -->
  <g transform="translate(607, 48)">
    <!-- Outer shield -->
    <path d="M33 0 L0 12 L0 32 C0 52 14 64 33 70 C52 64 66 52 66 32 L66 12 Z"
          fill="rgba(0,200,164,0.10)" stroke="#00C8A4" stroke-width="1.6" stroke-opacity="0.75"/>
    <!-- Inner A shape -->
    <text x="33" y="45" font-family="Arial Black, Arial, sans-serif" font-size="26" font-weight="900"
          fill="#00C8A4" text-anchor="middle" opacity="0.9">A</text>
  </g>

  <!-- ARKASERVE wordmark -->
  <text x="640" y="202" font-family="Arial Black, Arial, sans-serif" font-size="82" font-weight="900"
        text-anchor="middle" letter-spacing="5">
    <tspan fill="white">ARKA</tspan><tspan fill="#00C8A4">SERVE</tspan>
  </text>

  <!-- Tagline -->
  <text x="640" y="236" font-family="Arial, sans-serif" font-size="13" font-weight="400"
        text-anchor="middle" fill="rgba(255,255,255,0.38)" letter-spacing="7">
    PROTECTED SERVICE VESSEL
  </text>

  <!-- Separator -->
  <line x1="420" y1="263" x2="860" y2="263" stroke="url(#tealLine)" stroke-width="1" opacity="0.9"/>

  <!-- Products row -->
  <!-- MockTest -->
  <g transform="translate(266, 285)">
    <rect x="0" y="0" width="8" height="8" rx="2" fill="#00C8A4"/>
    <text x="16" y="9" font-family="Arial, sans-serif" font-size="13" font-weight="700"
          fill="rgba(255,255,255,0.80)">MockTest Platform</text>
    <text x="16" y="26" font-family="Arial, sans-serif" font-size="11"
          fill="rgba(255,255,255,0.36)">mocktest.anilsoft.com</text>
  </g>

  <!-- Divider dot 1 -->
  <circle cx="535" cy="296" r="2" fill="rgba(255,255,255,0.20)"/>

  <!-- PDF Tools -->
  <g transform="translate(554, 285)">
    <rect x="0" y="0" width="8" height="8" rx="2" fill="#F7A84A"/>
    <text x="16" y="9" font-family="Arial, sans-serif" font-size="13" font-weight="700"
          fill="rgba(255,255,255,0.80)">PDF Tools</text>
    <text x="16" y="26" font-family="Arial, sans-serif" font-size="11"
          fill="rgba(255,255,255,0.36)">pdftools.anilsofttech.com</text>
  </g>

  <!-- Divider dot 2 -->
  <circle cx="745" cy="296" r="2" fill="rgba(255,255,255,0.20)"/>

  <!-- Career Guide -->
  <g transform="translate(762, 285)">
    <rect x="0" y="0" width="8" height="8" rx="2" fill="#A78BFA"/>
    <text x="16" y="9" font-family="Arial, sans-serif" font-size="13" font-weight="700"
          fill="rgba(255,255,255,0.80)">Career Guide</text>
    <text x="16" y="26" font-family="Arial, sans-serif" font-size="11"
          fill="rgba(255,255,255,0.36)">projects.anilsoft.com</text>
  </g>

  <!-- Subtle scattered teal stars -->
  <circle cx="120" cy="80"  r="1.5" fill="#00C8A4" opacity="0.25"/>
  <circle cx="230" cy="200" r="1"   fill="#00C8A4" opacity="0.18"/>
  <circle cx="80"  cy="280" r="1.5" fill="#00C8A4" opacity="0.20"/>
  <circle cx="1160" cy="60"  r="1.5" fill="#00C8A4" opacity="0.25"/>
  <circle cx="1050" cy="190" r="1"   fill="#00C8A4" opacity="0.18"/>
  <circle cx="1200" cy="300" r="1.5" fill="#00C8A4" opacity="0.20"/>
  <circle cx="350" cy="50"  r="1"   fill="#A78BFA" opacity="0.22"/>
  <circle cx="920" cy="45"  r="1"   fill="#F7A84A" opacity="0.22"/>
</svg>
